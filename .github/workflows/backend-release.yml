name: Backend build & deploy

on:
  # Only main builds and deploys. Feature-branch pushes stay silent; pull requests still
  # compile and test without deployment credentials.
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-release.yml"
      - ".github/workflows/backend-deploy.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-release.yml"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a main run while it may be stopping/restarting production.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# 仅构建 Linux x86_64 (glibc) 版本。
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          key: x86_64-unknown-linux-gnu

      - name: 自动部署及发行版本回归测试
        run: |
          bash backend/deploy/test-auto-deploy.sh
          bash backend/scripts/test-release-version.sh

      - name: 代码格式检查
        working-directory: backend
        run: cargo fmt --all -- --check

      - name: 测试
        working-directory: backend
        run: cargo test --locked

      - name: 构建并打包
        working-directory: backend
        run: |
          bash ./scripts/build-release.sh \
            --target x86_64-unknown-linux-gnu \
            --out "$GITHUB_WORKSPACE/dist" \
            --no-tests

      - uses: actions/upload-artifact@v4
        with:
          name: market-event-analyzer-x86_64-unknown-linux-gnu
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: 自动部署到服务器
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/backend-deploy.yml
    secrets: inherit
