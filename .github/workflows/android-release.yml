name: Unified Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Test release tooling and inspect immutable publication
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_*.py'
          args=()
          if [[ "$REF_TYPE" == tag ]]; then args+=(--tag "$REF_NAME"); fi
          python3 scripts/release_tools.py preflight "${args[@]}" --commit "$GITHUB_SHA"

  build:
    name: Signed Android APK
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and sign APK
        working-directory: android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_SERVICES_JSON_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name. See docs/github-release.md."
              exit 1
            fi
          done
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/macro-research-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH" app/google-services.json' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          bash ./gradlew --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Extract actual APK metadata and embedded notes
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          python3 scripts/release_tools.py apk --apk android/app/build/outputs/apk/release/app-release.apk --aapt "$AAPT" --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: unified-android-${{ github.run_id }}
          overwrite: true
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  backend:
    name: Linux x86_64 backend from the same commit
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          key: unified-x86_64-unknown-linux-gnu
      - name: Test backend and package unified version
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          BACKEND_GIT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash backend/deploy/test-auto-deploy.sh
          bash backend/scripts/test-release-version.sh
          cd backend
          cargo fmt --all -- --check
          cargo test --locked
          bash ./scripts/build-release.sh --version "$RELEASE_VERSION" --target x86_64-unknown-linux-gnu --out "$GITHUB_WORKSPACE/dist" --no-tests
      - uses: actions/upload-artifact@v4
        with:
          name: unified-backend-${{ github.run_id }}
          overwrite: true
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  bundle:
    name: Verify complete unified distribution
    needs: [preflight, build, backend]
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      # Fixed per-run names plus replaceable INTERNAL artifacts support both full and failed-job reruns.
      # Never merge an earlier bundled artifact over the two current build outputs.
      - uses: actions/download-artifact@v4
        with:
          name: unified-android-${{ github.run_id }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: unified-backend-${{ github.run_id }}
          path: dist
      - name: Assemble and verify all attachments, including manual branch builds
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$REF_TYPE" == tag ]]; then args+=(--tag "$REF_NAME"); fi
          python3 scripts/release_tools.py assemble "${args[@]}" --commit "$GITHUB_SHA" --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: unified-release-${{ github.run_id }}
          overwrite: true
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Verify all attachments and publish together
    needs: [preflight, bundle]
    if: github.ref_type == 'tag' && needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: unified-release-${{ github.run_id }}
          path: dist
      - name: Publish only a verified complete draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/release_tools.py verify --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --out dist
          python3 scripts/release_tools.py publish --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --out dist
